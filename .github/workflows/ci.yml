name: Verify package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/cli-proof.mjs
      - run: mkdir .release && npm pack --pack-destination .release
      - run: npm install --prefix examples/task-app
      - run: npm install --prefix examples/task-app --no-save ./.release/*.tgz
      - run: npm run build --prefix examples/task-app
      - run: npx playwright install --with-deps chromium
      - run: MOMENTS_TARBALL="$(realpath .release/*.tgz)" npm run proof --prefix examples/task-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-and-package
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/*.tgz
            examples/task-app/.proof/**
