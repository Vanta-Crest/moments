name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: node scripts/cli-proof.mjs
      - run: mkdir .release && npm pack --pack-destination .release
      # The packed tarball stands in for the registry version the example names.
      - run: npm install --prefix examples/task-app --no-save ./.release/*.tgz
      - run: npm run build --prefix examples/task-app
      - run: MOMENTS_TARBALL="$(realpath .release/*.tgz)" npm run proof --prefix examples/task-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-package-and-proof
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/*.tgz
            examples/task-app/.proof/**
      # A prerelease (0.3.0-rc.1) goes out as `next`, so `npm install` keeps resolving the last release.
      - name: Dist-tag
        id: dist
        run: echo "tag=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")" >> "$GITHUB_OUTPUT"
      - name: Registry credentials
        run: |
          printf '@vanta-crest:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/npmjs.npmrc"
          printf '@vanta-crest:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/github.npmrc"
      - name: Publish to npm
        run: npm publish ./.release/*.tgz --tag ${{ steps.dist.outputs.tag }} --access public --provenance --userconfig "$RUNNER_TEMP/npmjs.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 0.3.x also goes to GitHub Packages so the move to npm can be undone; drop this after 0.3.
      - name: Publish to GitHub Packages
        run: npm publish ./.release/*.tgz --tag ${{ steps.dist.outputs.tag }} --userconfig "$RUNNER_TEMP/github.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
