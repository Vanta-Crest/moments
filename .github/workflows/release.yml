name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@vanta-crest'
          cache: npm
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm test
      - run: node scripts/cli-proof.mjs
      - run: mkdir .release && npm pack --pack-destination .release
      - run: npm install --prefix examples/task-app
      - run: npm install --prefix examples/task-app --no-save ./.release/*.tgz
      - run: npm run build --prefix examples/task-app
      - run: npx playwright install --with-deps chromium
      - run: MOMENTS_TARBALL="$(realpath .release/*.tgz)" npm run proof --prefix examples/task-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-package-and-proof
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/*.tgz
            examples/task-app/.proof/**
      - run: npm publish ./.release/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
